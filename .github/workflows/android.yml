name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare ChatGPT Workspace
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          dependency = '    implementation("androidx.browser:browser:1.10.0")\n'
          if 'androidx.browser:browser:' not in text:
              marker = '    implementation("androidx.webkit:webkit:1.12.1")\n'
              if marker not in text:
                  raise SystemExit('Browser dependency insertion point not found')
              gradle.write_text(text.replace(marker, marker + dependency, 1))

          main = Path('android/app/src/main/java/ai/wisp/trader/MainActivity.kt')
          text = main.read_text()
          text = text.replace('import androidx.activity.compose.setContent\n', 'import androidx.activity.compose.setContent\nimport androidx.browser.customtabs.CustomTabsIntent\n', 1)
          text = text.replace('ChatGptBrowserScreen(Modifier.padding(padding))', 'ChatGptWorkspaceScreen(Modifier.padding(padding))', 1)

          workspace = r'''

@Composable
private fun ChatGptWorkspaceScreen(modifier: Modifier = Modifier) {
    val context = LocalContext.current
    var searchOrUrl by remember { mutableStateOf(CHATGPT_URL) }

    fun openWorkspace(url: String) {
        val target = url.trim().ifBlank { CHATGPT_URL }
        runCatching {
            CustomTabsIntent.Builder()
                .setShowTitle(true)
                .setUrlBarHidingEnabled(false)
                .setShareState(CustomTabsIntent.SHARE_STATE_ON)
                .setColorScheme(CustomTabsIntent.COLOR_SCHEME_DARK)
                .build()
                .launchUrl(context, android.net.Uri.parse(target))
        }.onFailure {
            openExternalBrowser(context, target)
        }
    }

    Column(
        modifier = modifier.fillMaxSize().padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp)
    ) {
        Card(Modifier.fillMaxWidth()) {
            Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                Text("ChatGPT Workspace", style = MaterialTheme.typography.headlineSmall)
                Text("Chrome Custom Tabs is used for the ChatGPT workspace so the real browser login, cookies, JavaScript and redirects are available.")
                Text("This avoids the blank/loading loop that can occur when ChatGPT is embedded in Android WebView.", style = MaterialTheme.typography.bodySmall)
            }
        }

        OutlinedTextField(
            value = searchOrUrl,
            onValueChange = { searchOrUrl = it },
            modifier = Modifier.fillMaxWidth(),
            singleLine = true,
            label = { Text("Address / search") }
        )

        Button(
            onClick = {
                val value = searchOrUrl.trim()
                val target = if (value.startsWith("https://") || value.startsWith("http://")) {
                    value
                } else {
                    "https://www.google.com/search?q=" + java.net.URLEncoder.encode(value, "UTF-8")
                }
                openWorkspace(target)
            },
            modifier = Modifier.fillMaxWidth()
        ) { Text("Open in browser workspace") }

        OutlinedButton(
            onClick = { openWorkspace(CHATGPT_URL) },
            modifier = Modifier.fillMaxWidth()
        ) { Text("Open my ChatGPT chat") }

        Text(
            "Login is handled by the installed Chrome/Brave browser. The Trader tab remains native and standalone.",
            style = MaterialTheme.typography.bodySmall
        )
    }
}
'''
          if 'private fun ChatGptWorkspaceScreen' not in text:
              text += workspace
          main.write_text(text)
          PY
      - name: Verify standalone Android architecture
        run: |
          set -e
          matches="$(grep -RInE 'https?://(127\.0\.0\.1|localhost|10\.0\.2\.2)(:[0-9]+)?([/\"[:space:]]|$)' app/src --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.properties' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'Standalone APK must not contain hard-coded local backend endpoints.'
            exit 1
          fi
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK output
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wisp-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
