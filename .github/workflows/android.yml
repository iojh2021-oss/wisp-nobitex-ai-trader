name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Wire Nobitex Market tab
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/ai/wisp/trader/MainActivity.kt')
          s = p.read_text()
          if 'NobitexMarketTab' in s:
              print('Market tab already wired; no source change needed.')
              raise SystemExit(0)
          old = '''title = {\n                        Text(if (selectedTab == 0) "Wisp Trader" else "ChatGPT Workspace")\n                    }'''
          new = '''title = {\n                        Text(when (selectedTab) {\n                            0 -> "Wisp Trader"\n                            1 -> "ChatGPT Workspace"\n                            else -> "Nobitex Market"\n                        })\n                    }'''
          if old not in s: raise SystemExit('MainActivity title block not found')
          s = s.replace(old, new, 1)
          old = '''                    NavigationBarItem(\n                        selected = selectedTab == 1,\n                        onClick = { selectedTab = 1 },\n                        icon = { Icon(Icons.Outlined.ChatBubbleOutline, "ChatGPT") },\n                        label = { Text("ChatGPT") }\n                    )'''
          new = old + '''\n                    NavigationBarItem(\n                        selected = selectedTab == 2,\n                        onClick = { selectedTab = 2 },\n                        icon = { Icon(Icons.Outlined.Refresh, "Market") },\n                        label = { Text("Market") }\n                    )'''
          if old not in s: raise SystemExit('MainActivity navigation block not found')
          s = s.replace(old, new, 1)
          old = '''            if (selectedTab == 0) {\n                TraderScreen(Modifier.padding(padding))\n            } else {\n                ChatGptBrowserScreen(Modifier.padding(padding))\n            }'''
          new = '''            when (selectedTab) {\n                0 -> TraderScreen(Modifier.padding(padding))\n                1 -> ChatGptBrowserScreen(Modifier.padding(padding))\n                else -> NobitexMarketTab(Modifier.padding(padding))\n            }'''
          if old not in s: raise SystemExit('MainActivity content block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify standalone Android architecture
        run: |
          set -e
          matches="$(grep -RInE 'https?://(127\.0\.0\.1|localhost|10\.0\.2\.2)(:[0-9]+)?([/\"[:space:]]|$)' app/src --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.properties' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'Standalone APK must not contain hard-coded local backend endpoints.'
            exit 1
          fi
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK output
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Commit market tab wiring
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/ai/wisp/trader/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat(android): wire Nobitex Market Tab'
          git push origin HEAD:main
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wisp-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
