name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify standalone Android architecture
        run: |
          set -e
          if grep -RInE '127\.0\.0\.1|10\.0\.2\.2|localhost|termux' app --exclude-dir=build --exclude='*.md'; then
            echo 'Standalone APK must not depend on a local Termux/backend endpoint.'
            exit 1
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
