name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify standalone Android architecture
        run: |
          set -e
          matches="$(grep -RInE '127\.0\.0\.1|10\.0\.2\.2|localhost|termux' app/src --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.properties' || true)"
          unexpected="$(printf '%s\n' "$matches" | grep -Ev 'MainActivity\.kt:.*No Termux, localhost backend, or emulator address is required' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            echo 'Standalone APK must not depend on a local Termux/backend endpoint.'
            exit 1
          fi
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK output
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wisp-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
