name: Wire Nobitex Market Tab

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/java/ai/wisp/trader/NobitexMarketTab.kt'
      - '.github/workflows/wire-market-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: "${{ !contains(github.event.head_commit.message, 'feat(android): wire Nobitex Market Tab') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire the third tab into MainActivity
        run: python3 scripts/wire_market_tab.py
      - name: Verify source wiring
        run: |
          grep -q 'NobitexMarketTab' android/app/src/main/java/ai/wisp/trader/MainActivity.kt
          test -s android/app/src/main/java/ai/wisp/trader/NobitexMarketTab.kt
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/ai/wisp/trader/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat(android): wire Nobitex Market Tab'
          git push origin HEAD:main
