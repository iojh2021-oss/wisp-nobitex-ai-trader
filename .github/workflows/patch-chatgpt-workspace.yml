name: Patch ChatGPT Workspace

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-chatgpt-workspace.yml']

permissions:
  contents: write
  actions: write

jobs:
  patch:
    if: github.event.head_commit.message != '[bot] patch ChatGPT workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ChatGPT workspace to use Chrome Custom Tabs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          dep = '    implementation("androidx.browser:browser:1.10.0")\n'
          if 'androidx.browser:browser:' not in text:
              marker = '    implementation("androidx.webkit:webkit:1.12.1")\n'
              if marker not in text:
                  raise SystemExit('Could not find dependency insertion point')
              text = text.replace(marker, marker + dep, 1)
              gradle.write_text(text)

          main = Path('android/app/src/main/java/ai/wisp/trader/MainActivity.kt')
          text = main.read_text()
          old = 'ChatGptBrowserScreen(Modifier.padding(padding))'
          new = 'ChatGptWorkspaceScreen(Modifier.padding(padding))'
          if old not in text:
              raise SystemExit('MainActivity ChatGPT screen call not found')
          text = text.replace(old, new, 1)

          if 'androidx.browser.customtabs.CustomTabsIntent' not in text:
              text = text.replace(
                  'import androidx.activity.compose.setContent\n',
                  'import androidx.activity.compose.setContent\nimport androidx.browser.customtabs.CustomTabsIntent\n',
                  1,
              )

          workspace = r'''

@Composable
private fun ChatGptWorkspaceScreen(modifier: Modifier = Modifier) {
    val context = LocalContext.current
    var searchOrUrl by remember { mutableStateOf(CHATGPT_URL) }

    fun openInSupportedBrowser(url: String) {
        val target = url.trim().ifBlank { CHATGPT_URL }
        runCatching {
            val customTabs = CustomTabsIntent.Builder()
                .setShowTitle(true)
                .setUrlBarHidingEnabled(false)
                .setShareState(CustomTabsIntent.SHARE_STATE_ON)
                .setColorScheme(CustomTabsIntent.COLOR_SCHEME_DARK)
                .build()
            customTabs.launchUrl(context, android.net.Uri.parse(target))
        }.onFailure {
            runCatching {
                context.startActivity(
                    android.content.Intent(
                        android.content.Intent.ACTION_VIEW,
                        android.net.Uri.parse(target)
                    )
                )
            }
        }
    }

    DisposableEffect(Unit) {
        openInSupportedBrowser(CHATGPT_URL)
        onDispose { }
    }

    Column(
        modifier = modifier.fillMaxSize().padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp)
    ) {
        Card(Modifier.fillMaxWidth()) {
            Column(
                Modifier.padding(16.dp),
                verticalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                Text("ChatGPT Workspace", style = MaterialTheme.typography.headlineSmall)
                Text(
                    "ChatGPT is opened with Android Custom Tabs so login, cookies, JavaScript, redirects and the real Chrome/Brave browser engine are available."
                )
                Text(
                    "This replaces the unreliable embedded WebView for ChatGPT only. The Trader tab remains fully native and standalone."
                )
            }
        }

        OutlinedTextField(
            value = searchOrUrl,
            onValueChange = { searchOrUrl = it },
            modifier = Modifier.fillMaxWidth(),
            singleLine = true,
            label = { Text("Search / URL") }
        )

        Button(
            onClick = {
                val value = searchOrUrl.trim()
                val target = if (
                    value.startsWith("https://") || value.startsWith("http://")
                ) {
                    value
                } else {
                    "https://www.google.com/search?q=" +
                        java.net.URLEncoder.encode(value, "UTF-8")
                }
                openInSupportedBrowser(target)
            },
            modifier = Modifier.fillMaxWidth()
        ) {
            Text("Open in Chrome Workspace")
        }

        OutlinedButton(
            onClick = { openInSupportedBrowser(CHATGPT_URL) },
            modifier = Modifier.fillMaxWidth()
        ) {
            Text("Open my ChatGPT chat")
        }

        Text(
            "Login is handled by the supported browser session. Do not enter passwords or API keys into the Trader tab unless you intentionally want to configure its API connection.",
            style = MaterialTheme.typography.bodySmall
        )
    }
}
'''

          if 'private fun ChatGptWorkspaceScreen' not in text:
              text += workspace
          main.write_text(text)
          PY

      - name: Remove one-shot patch workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-chatgpt-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/build.gradle.kts android/app/src/main/java/ai/wisp/trader/MainActivity.kt .github/workflows/patch-chatgpt-workspace.yml
          git diff --cached --quiet && exit 0
          git commit -m '[bot] patch ChatGPT workspace'
          git push origin HEAD:main

      - name: Dispatch Android APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 'Android APK' --repo '${{ github.repository }}' --ref main
