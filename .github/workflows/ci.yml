name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -q

  wisp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Verify modules
        run: go mod verify
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
