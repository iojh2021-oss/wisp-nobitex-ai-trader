[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisp-nobitex-ai-trader"
version = "0.1.0"
description = "Safety-first OpenAI trading agent with a Nobitex adapter and paper execution"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "openai>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
